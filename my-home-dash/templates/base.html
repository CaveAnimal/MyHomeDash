<!doctype html>
<html lang="en" data-bs-theme="{{ cfg.get('display',{}).get('theme','dark') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Home Dash{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  <!-- Chart.js (weather hourly graph) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand px-3 py-2 border-bottom mhd-navbar">
  <a class="navbar-brand fw-bold me-3" href="{{ url_for('index') }}">
    <i class="bi bi-house-heart-fill text-primary me-1"></i>
    My Home Dash
  </a>
  <div class="navbar-nav flex-row gap-2 me-3 mhd-nav-links">
    <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="{{ url_for('index') }}">Home</a>
    <a class="nav-link {% if active_page == 'irrigation' %}active{% endif %}" href="{{ url_for('irrigation_project') }}">Irrigation</a>
    <a class="nav-link {% if active_page == 'page2' %}active{% endif %}" href="{{ url_for('page2') }}">Page2</a>
    <a class="nav-link {% if active_page == 'spam' %}active{% endif %}" href="{{ url_for('spam_page') }}">Spam</a>
    <a class="nav-link {% if active_page == 'llc' %}active{% endif %}" href="{{ url_for('llc_page') }}">LLC</a>
    <a class="nav-link {% if active_page == 'adobe' %}active{% endif %}" href="{{ url_for('adobe_page') }}">Adobe</a>
    <a class="nav-link {% if active_page == 'microsoft' %}active{% endif %}" href="{{ url_for('microsoft_page') }}">Microsoft</a>
    <a class="nav-link {% if active_page == 'chair_tai_chi' %}active{% endif %}" href="{{ url_for('chair_tai_chi') }}">Tai Chi</a>
    <a class="nav-link {% if active_page == 'ai_news' %}active{% endif %}" href="{{ url_for('ai_news') }}">AI News</a>
    <a class="nav-link {% if active_page == 'ai_chat' %}active{% endif %}" href="{{ url_for('ai_chat') }}">AI Chat</a>
    <a class="nav-link {% if active_page == 'operator' %}active{% endif %}" href="{{ url_for('operator_page') }}">AI Operator</a>
  </div>
  <span class="navbar-text me-auto">
    <span id="today-str" class="text-muted small">{{ today_str }}</span>
  </span>
  <span class="navbar-text me-3">
    <i class="bi bi-clock me-1 text-muted"></i>
    <span id="live-clock" class="fw-semibold">{{ now_str }}</span>
  </span>
  <button class="btn btn-outline-secondary btn-sm"
          hx-post="/api/refresh/all"
          hx-target="body"
          hx-swap="outerHTML"
          hx-indicator="#spinner">
    <i class="bi bi-arrow-clockwise me-1"></i>Refresh All
  </button>
  <span id="spinner" class="htmx-indicator ms-2 spinner-border spinner-border-sm text-primary" role="status"></span>
</nav>

<!-- ── Main content ─────────────────────────────────────────────────────── -->
<main class="container-fluid px-3 py-3">
  {% block content %}{% endblock %}
</main>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='email_organizer.js') }}"></script>
</body>
</html>
